# The relay at wss://relay.example.org -- put the real name in. Install
# as /etc/nginx/sites-available/thinksynth, link it into sites-enabled,
# then
#
#   sudo certbot --nginx -d relay.example.org
#
# which adds the listen 443 and certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.org;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The client's address, for the account API's rate limits; the
        # relay reads one proxy's worth of it (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A document socket can sit quiet for as long as nobody types, and
        # nginx's 60 s default would cut it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
