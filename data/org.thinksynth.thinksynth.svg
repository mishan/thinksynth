<?xml version="1.0" encoding="UTF-8"?>
<!-- thinksynth. A waveform over three patch points joined by a cord: the two
     things the whole program is about. No text, so it stays legible at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4ca8"/>
      <stop offset="1" stop-color="#241c3a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <path d="M20 58 Q34 20 48 58 T76 58 T104 58" fill="none" stroke="#7ee0c8"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 98 Q64 76 94 98" fill="none" stroke="#f2b544" stroke-width="5"
        stroke-linecap="round" opacity="0.85"/>
  <circle cx="34" cy="98" r="9" fill="#f2b544"/>
  <circle cx="64" cy="98" r="9" fill="#f2b544"/>
  <circle cx="94" cy="98" r="9" fill="#f2b544"/>
</svg>
