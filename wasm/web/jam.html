<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>thinksynth &mdash; a room</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="panes.css">
</head>
<body>
<h1>thinksynth <span class="dim">&mdash; a room</span></h1>

<p id="status">Join a room.</p>

<!-- Who and where. The room's name is the URL's, and so is the piece a
     new room is seeded with (?room=x&piece=ebb.gen). -->
<section id="joinrow" class="row">
  <label>Room <input id="room" size="12" value="lobby"></label>
  <label>Name <input id="name" size="12"></label>
  <button id="join">Join</button>
</section>

<section id="roompanel" hidden>
  <!-- Who is here, and by which path. -->
  <div class="row">
    <span id="peers" class="peers"></span>
  </div>

  <!-- A seat is an instrument the piece declares, on the channel it was
       given; keys play into it, on every peer. -->
  <div class="row">
    <label>Seat <select id="seat"><option value="">none</option></select></label>
    <button id="start">Start</button>
    <button id="play" disabled>Play</button>
    <button id="stop" disabled>Stop</button>
    <label>Tempo <input id="tempo" type="number" min="20" max="300" step="1" value="120" size="4" disabled></label>
    <span id="clock">0:00.0</span>
  </div>

  <p id="about"></p>

  <!-- Where the tiler puts the panes below, when there is one. Empty and
       invisible otherwise, and the page is the document it has always
       been: panes.js adopts what is marked `data-pane' and puts every one
       of them back where it was when the layout goes away. -->
  <div id="panes"></div>

  <!-- The piano roll: every chain's output on one timeline, the past left
       of the now-line and the *scheduled future* ghosted to the right of
       it -- what the piece has already decided and not yet played. It is
       the desktop's roll, compiled to wasm and drawn by the mirror, which
       is where the scheduler holding that future is. Drag it to scrub back
       through what has been played, double-click to go back to live, and
       the wheel changes how much time is on screen. -->
  <div id="roll" class="canvasview rollview"
       data-pane data-pane-title="Piano roll" data-pane-min="320">
    <canvas id="rollcanvas" tabindex="0"></canvas>
  </div>

  <div id="knobs"
       data-pane data-pane-title="The piece's knobs"
       data-pane-min="240"></div>

  <!-- The piece's picture, drawn by the mirror: a second scheduler in a
       worker, fed the same commands this page's worklet is fed, holding
       real composer instances. A gesture on an enlarged picture is a
       command like a knob -- stamped, sent, and applied at its time on
       every peer, so what one person paints everybody sees on the same
       beat. -->
  <details id="composerview" open
           data-pane data-pane-min="360">
    <summary>The composers</summary>
    <div id="composerscroll" class="canvasview">
      <canvas id="composer" tabindex="0"></canvas>
    </div>
    <div class="row" id="composerstages"></div>
    <p id="composerstatus" class="hint"></p>
  </details>

  <!-- The instrument, as on the solo page. -->
  <section id="keyboard"
           data-pane data-pane-title="Keys" data-pane-min="280">
    <div class="row">
      <button id="down" class="octave" aria-label="An octave down">&#9664;</button>
      <span id="range"></span>
      <button id="up" class="octave" aria-label="An octave up">&#9654;</button>

      <!-- Whether a letter is a note at the moment, which it is unless
           something was tabbed to or is being typed into (keyfocus.js).
           Empty the rest of the time: the ordinary state is not worth a
           word, and a line that is always there is one nobody reads. -->
      <span id="keysstate" class="hint" aria-live="polite"></span>

      <!-- A MIDI keyboard onto the same keys, into the seat (midi.js).
           Offered once the synth has started. -->
      <button id="midi" disabled>MIDI in</button>
      <span id="midistatus" class="hint"></span>
    </div>
    <svg id="keys" role="application" aria-label="Keyboard"></svg>
  </section>

  <!-- The document: a tab per file, everyone's cursors, and Apply, which
       is Play from a new origin with the text as it stands. -->
  <details id="documentbox" open
           data-pane data-pane-min="380">
    <summary>The piece</summary>
    <div class="row">
      <span id="tabs" class="tabs"></span>
      <button id="apply" disabled>Apply</button>
    </div>
    <div id="editor"></div>
  </details>

  <!-- The .dsp canvas, over the document: the desktop's node editor, with
       its graph, its layout and its writer compiled to wasm and run in
       this page's own instance of the module. An edit is a splice into
       the shared file, so it is everybody's edit, and the piece plays it
       at the next Apply. -->
  <details id="nodeview"
           data-pane data-pane-min="400">
    <summary>The instrument</summary>
    <div class="row">
      <label>File <select id="nodefile"></select></label>
      <label>Add <select id="nodepalette"></select></label>
      <button id="nodeadd">Add node</button>
      <button id="nodefit">Fit</button>
      <span id="nodeselected"></span>
    </div>
    <div id="nodescroll" class="canvasview">
      <canvas id="nodecanvas" tabindex="0"></canvas>
    </div>
    <div id="nodeparams"></div>
  </details>

  <details id="detail"
           data-pane data-pane-min="240">
    <summary>The numbers</summary>
    <div class="row">
      <label>Knob lead <input id="knoblead" type="number" min="0" max="5" step="0.01" size="5"> s</label>
      <label>Transport lead <input id="transportlead" type="number" min="0" max="5" step="0.01" size="5"> s</label>
      <button id="export" disabled>Download the tape</button>
    </div>
    <pre id="numbers"></pre>
    <pre id="log"></pre>
  </details>
</section>

<!-- What a stage's params handle asks for, and what a right-click on a
     port offers: placed in page coordinates beside whatever asked for
     them, so where they sit in the document says nothing -- except that
     being after every pane is what keeps them over one. -->
<div id="composerparams" class="popover" hidden></div>
<div id="nodemenu" class="popover" hidden></div>

<script type="module" src="jam.js"></script>
</body>
</html>
