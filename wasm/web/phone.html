<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>thinksynth: a phone as a controller</title>
<link rel="stylesheet" href="style.css">
<!-- The whole screen is the pad: no scrolling, no pull to refresh, no
     zoom, so every touch is a finger played (docs/PHONE.md). -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden;
               overscroll-behavior: none; }
  #pad { position: fixed; inset: 0; touch-action: none; user-select: none;
         -webkit-user-select: none; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 1em;
         text-align: center; padding: 1em; box-sizing: border-box; }
  #pad .finger { position: fixed; width: 3em; height: 3em;
                 margin: -1.5em 0 0 -1.5em; border-radius: 50%;
                 background: currentColor; opacity: 0.3;
                 pointer-events: none; }
</style>
</head>
<body>
<div id="pad">
  <h1>thinksynth</h1>
  <!-- Start is a tap, which iOS asks for before a page may read motion. -->
  <button id="start">Start</button>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="phone.js"></script>
</body>
</html>
