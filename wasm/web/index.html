<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thinksynth</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 60em; margin: 2em auto;
         padding: 0 1em; }
  textarea, pre { font: 13px/1.35 ui-monospace, monospace; }
  textarea { width: 100%; height: 26em; box-sizing: border-box; }
  label[for="dsp"], label[for="gen"] { display: block; margin-bottom: 0.3em; }
  pre { background: #f4f4f4; padding: 0.6em 0.8em; margin: 0.8em 0; }
  #log { max-height: 10em; overflow: auto; }
  .row { display: flex; gap: 0.6em; align-items: center; margin: 0.8em 0;
         flex-wrap: wrap; }
  kbd { border: 1px solid #aaa; border-radius: 3px; padding: 0 0.3em; }
  h2 { font-size: 1.1em; margin: 1.6em 0 0.4em; }
  [hidden] { display: none !important; }
  #roll { width: 100%; height: 180px; background: #f4f4f4; display: block;
          margin: 0.8em 0; }
  #knobs { display: grid; grid-template-columns: max-content 1fr max-content;
           gap: 0.3em 0.8em; align-items: center; margin: 0.8em 0; }
  #knobs input { width: 100%; }
  #knobs .value { font: 13px ui-monospace, monospace; min-width: 5em;
                  text-align: right; }
  #about { margin: 0.4em 0; color: #666; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1b1b; color: #ddd; }
    pre, textarea, #roll { background: #262626; color: #ddd; }
    #about { color: #999; }
  }
</style>
</head>
<body>
<h1>thinksynth</h1>

<p id="status">Press Start, then play from the keyboard.</p>

<p>
  <kbd>Z</kbd> to <kbd>/</kbd> is an octave and a bit from C, with the black
  keys on the row above; <kbd>Q</kbd> to <kbd>P</kbd> is the octave above
  that. <kbd>-</kbd> and <kbd>=</kbd> move both an octave.
</p>

<div class="row">
  <button id="start">Start</button>
  <label>Play <select id="mode">
    <option value="patch">a patch</option>
    <option value="piece">a piece</option>
  </select></label>
</div>

<!-- M1: one .dsp, played from the computer keyboard. -->
<section id="patchmode">
  <div class="row">
    <label>Patch <select id="patch"></select></label>
    <button id="load" disabled>Load</button>
  </div>

  <label for="dsp">Patch source (.dsp)</label>
  <textarea id="dsp" spellcheck="false" autocomplete="off"></textarea>
</section>

<!-- M2: a .gen, composed by the scheduler in the worklet. The keyboard
     still plays, into whatever chains asked for `input midi'. -->
<section id="piecemode" hidden>
  <div class="row">
    <label>Piece <select id="piece"></select></label>
    <button id="loadpiece" disabled>Load</button>
    <button id="play" disabled>Play</button>
    <button id="stop" disabled>Stop</button>
    <button id="rewind" disabled>Rewind</button>
    <span id="clock">0:00.0</span>
  </div>

  <p id="about"></p>

  <!-- A piece may route `input midi' to a channel it declares no
       instrument for -- hands.gen declares none at all -- so the keys need
       a channel to arrive on and that channel may need something on it to
       sound. This is the desktop's Patch Selector, aimed by hand.

       These are the engine's channel numbers, which a .gen file's are not:
       a file writes `channel = 1' for the first one and the loader hands
       over 0. -->
  <div class="row">
    <label>Keys into channel <select id="keychan"></select></label>
    <label>with <select id="keypatch"></select></label>
    <button id="loadkeypatch" disabled>Put it there</button>
  </div>

  <canvas id="roll" width="1200" height="360"></canvas>

  <div id="knobs"></div>

  <label for="gen">Piece source (.gen)</label>
  <textarea id="gen" spellcheck="false" autocomplete="off"></textarea>
</section>

<pre id="latency"></pre>
<pre id="log"></pre>

<script type="module" src="main.js"></script>
</body>
</html>
