<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>thinksynth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>thinksynth</h1>

<p id="status">Press Start, then play.</p>

<div class="row">
  <button id="start">Start</button>
  <label>Play <select id="mode">
    <option value="patch">a patch</option>
    <option value="piece">a piece</option>
  </select></label>
</div>

<!-- M1: one .dsp, played from the keyboard. -->
<section id="patchmode">
  <div class="row">
    <label>Patch <select id="patch"></select></label>
    <button id="load" disabled>Load</button>
  </div>
</section>

<!-- M2: a .gen, composed by the scheduler in the worklet. The keyboard
     still plays, into whatever chains asked for `input midi'. -->
<section id="piecemode" hidden>
  <div class="row">
    <label>Piece <select id="piece"></select></label>
    <button id="loadpiece" disabled>Load</button>
    <button id="play" disabled>Play</button>
    <button id="stop" disabled>Stop</button>
    <button id="rewind" disabled>Rewind</button>
    <span id="clock">0:00.0</span>
  </div>

  <p id="about"></p>

  <canvas id="roll" width="1200" height="360"></canvas>

  <div id="knobs"></div>

  <!-- What each channel this piece touches sounds like: its own
       instruments, the channels its sinks name and left to the reader, the
       channels it takes `input midi' on, and wherever the keys are aimed.
       A channel the piece named and put nothing on is filled from the
       defaults the desktop's first run uses (AIMING.md, patch.js), so the
       piece sounds the same here in any order of clicks; one the piece
       aimed itself says so and has nothing to choose.

       Channel numbers here are the file's, 1-16, since that is what a
       person reading the piece's comment will be looking for; the engine
       counts them one lower and nothing outside it needs to know. The
       keys' selector counts the same way, for the same reason. -->
  <div class="row">
    <label>Keys into channel <select id="keychan"></select></label>
  </div>

  <div id="channels"></div>
</section>

<!-- The instrument, in both modes. Drawn to fit whatever width there is;
     main.js says how many octaves that comes to. -->
<section id="keyboard">
  <div class="row">
    <button id="down" class="octave" aria-label="An octave down">&#9664;</button>
    <span id="range"></span>
    <button id="up" class="octave" aria-label="An octave up">&#9654;</button>
  </div>
  <svg id="keys" role="application" aria-label="Keyboard"></svg>
  <p class="hint">
    Touch or click the keys. From a computer keyboard,
    <kbd>Z</kbd>&ndash;<kbd>/</kbd> is an octave and a bit from C with the
    black keys on the row above, <kbd>Q</kbd>&ndash;<kbd>P</kbd> the octave
    above that, and <kbd>-</kbd> and <kbd>=</kbd> move both.
  </p>
</section>

<details id="patchsource">
  <summary>Patch source (.dsp)</summary>
  <textarea id="dsp" spellcheck="false" autocomplete="off"
            autocapitalize="off" autocorrect="off"></textarea>
</details>

<details id="piecesource" hidden>
  <summary>Piece source (.gen)</summary>
  <textarea id="gen" spellcheck="false" autocomplete="off"
            autocapitalize="off" autocorrect="off"></textarea>
</details>

<details id="detail">
  <summary>What the browser reports</summary>
  <pre id="latency"></pre>
  <pre id="log"></pre>
</details>

<script type="module" src="main.js"></script>
</body>
</html>
