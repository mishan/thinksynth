# Three-platform CI. See docs/PORTING.md.
#
# Windows is MinGW-w64 via MSYS2, not MSVC. That is forced by gtkmm, which has
# no MSVC build, and reinforced by the eleven files in the tree that use
# variable-length arrays.
#
# STATUS: all nine jobs are real gates and must stay green. Four of the nine
# are the wasm gates, which share the one build job below them and run at
# once on what it makes. What CI does not cover is that hosted runners have
# no audio device, so the backends are only compiled and linked here, never
# opened. All three platforms have been run and heard on real hardware; none
# of that happened here.
#
# RtAudio and RtMidi are NOT installed from the system package manager on any
# platform here. Ubuntu 24.04 does not carry librtaudio-dev, 22.04 carries
# RtAudio 5.2 (the wrong API), and the Homebrew and MSYS2 spellings are
# different again -- guessing at all three is what broke this workflow in the
# first place. CMake fetches and statically links known-good 6.x instead, the
# same way on every runner. Roughly half a minute per job, and deterministic.
#
# The gates are the headless harnesses, which need neither an audio device nor
# (except on Linux, where the Gtk::Application is constructed before getopt) a
# display.

name: ci

# Nothing here writes anything back: the jobs check out, build, test, and
# upload artefacts, and upload-artifact does not go through GITHUB_TOKEN.
# Declared at the workflow level so a job added later starts read-only and
# has to ask, rather than inheriting whatever the repository default is.
# release.yml needs contents: write and says so on its own.
permissions:
  contents: read

on:
  # Only master on push. `pull_request' already covers every topic branch,
  # and listing them under `push' too is what made each job appear twice --
  # once as (push) and once as (pull_request) -- since every branch in the
  # porting stack has a PR open against the one below it.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no point finishing a run nobody will
# look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No UNBUILT_PLUGINS here any more: which DSPs are eligible is decided by
# cmake/RunHarness.cmake, which reads each file rather than matching names.

jobs:
  linux:
    name: linux (gcc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build bison flex pkg-config \
            libgtkmm-4.0-dev libsigc++-3.0-dev \
            libasound2-dev libjack-jackd2-dev \
            adwaita-icon-theme librsvg2-common \
            xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      # The Gtk::Application is created before getopt runs, so even -h needs a
      # display. xvfb is the whole reason this is not a plain invocation. It
      # was Gtk::Main before the gtkmm-4 port; the constraint is the same one.
      - name: Smoke test
        run: xvfb-run -a ./build/src/thinksynth -h

      # Under xvfb because one gate -- editorcheck -- builds real widgets: a
      # probe is a panel, a tap and a module instance at once, and NodeEditor
      # is the only place the three meet. Everything else here is headless and
      # does not care. editorcheck skips itself rather than failing where there
      # is no display, so this is what makes it actually run.
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/package

      - uses: actions/upload-artifact@v4
        with:
          name: thinksynth-linux-x86_64
          path: |
            build/package/*.tar.gz
            build/package/*.zip
            build/package/*.dmg
          if-no-files-found: error

      # The bundled GTK data -- schemas, pixbuf loaders, icon themes -- exists
      # for macOS and Windows, which are precisely the two platforms where it
      # cannot be tested: CI has no machine without GTK on it, so a package
      # that only works where it was built looks exactly like a good one.
      #
      # THINK_BUNDLE_GTK is therefore settable on Linux, where the mechanism
      # is identical (Ubuntu's gdk-pixbuf is built -Drelocatable=false, the
      # same as Homebrew's, so it takes the same substitution path as macOS),
      # and this runs it with the system's own GTK data hidden.
      - name: GTK runtime data
        run: |
          set -e
          # THINK_PKG_DEPS as well, which on Linux is not what a package
          # should be -- it drags the distribution's GTK in with it. It is on
          # here because the dependency closure is otherwise code that only
          # runs where nobody can watch it, and the thing it most recently got
          # wrong was invisible on Linux for exactly that reason.
          cmake -S . -B build -DTHINK_BUNDLE_GTK=ON -DTHINK_PKG_DEPS=ON \
                              -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build
          cmake --install build

          # librsvg is reachable only through a pixbuf loader, which is
          # dlopen'd and so is in no target's link graph. It went missing from
          # the macOS .app for precisely that reason, and the bundle looked
          # complete without it.
          ls stage/lib/librsvg* >/dev/null 2>&1 || {
            echo "librsvg is not in the package: the loader closure is not"
            echo "reaching modules again."
            exit 1
          }

          # The negative control comes first and on purpose. A check that
          # cannot fail is worse than no check, and the last two of these
          # could not: GTK carries fallback icons in its own gresource, and
          # gdk-pixbuf finds the system loader cache by a compiled-in path.
          # So: hide the bundle, and -G must fail.
          mv stage/share/thinksynth/share /tmp/hidden
          if xvfb-run -a env XDG_DATA_DIRS=/nonexistent ./stage/bin/thinksynth -G
          then
            echo "-G passed with no bundled data and the system's hidden."
            echo "It is not testing what it claims to test."
            exit 1
          fi
          mv /tmp/hidden stage/share/thinksynth/share

          # And the real one, from a directory the package was not built for,
          # because relocating is the entire point: an .app gets dragged and a
          # .zip gets unpacked wherever the user likes.
          mv stage /tmp/relocated
          xvfb-run -a env XDG_DATA_DIRS=/nonexistent /tmp/relocated/bin/thinksynth -G

      # The Homebrew shape, which is not the Linux or MSYS2 shape and is what
      # broke macOS: a keg holding schema XML but no compiled blob, with the
      # icons and the pixbuf loaders belonging to other formulae. Faked here
      # by pointing THINK_GTK_DATA_ROOTS at a directory built to look like
      # one, so the compile-the-XML-ourselves path has run somewhere before a
      # Mac runs it.
      - name: GTK runtime data (unlinked-keg layout)
        run: |
          set -e
          keg="$PWD/keg"
          mkdir -p "$keg/share/glib-2.0/schemas" "$keg/share/icons" \
                   "$keg/lib/gdk-pixbuf-2.0/2.10.0"
          cp /usr/share/glib-2.0/schemas/*.xml "$keg/share/glib-2.0/schemas/"
          cp -r /usr/share/icons/Adwaita "$keg/share/icons/"
          cp /usr/lib/*/gdk-pixbuf-2.0/2.10.0/loaders.cache \
             "$keg/lib/gdk-pixbuf-2.0/2.10.0/"
          # The MIME database too: without it gdk-pixbuf cannot identify an
          # SVG, and the keg would fail the SVG check for a reason that is
          # about this fixture rather than about the code under test.
          cp -r /usr/share/mime "$keg/share/"
          test ! -e "$keg/share/glib-2.0/schemas/gschemas.compiled"

          cmake -S . -B build -DTHINK_BUNDLE_GTK=ON \
                              -DTHINK_GTK_DATA_ROOTS="$keg" \
                              -DCMAKE_INSTALL_PREFIX="$PWD/kegstage"
          cmake --build build
          cmake --install build

          # The schema whose absence aborts the process, in the blob we built.
          # org.gtk.gtk4.*: GTK4 namespaces its schemas, and grepping for the
          # GTK3 name finds GTK3 on a machine that has both.
          strings kegstage/share/thinksynth/share/glib-2.0/schemas/gschemas.compiled \
            | grep -q org.gtk.gtk4.Settings.FileChooser

          mv kegstage /tmp/kegrelocated
          xvfb-run -a env XDG_DATA_DIRS=/nonexistent /tmp/kegrelocated/bin/thinksynth -G

  asan:
    name: linux asan + ubsan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build bison flex pkg-config \
            libgtkmm-4.0-dev libsigc++-3.0-dev \
            libasound2-dev libjack-jackd2-dev \
            adwaita-icon-theme librsvg2-common \
            xvfb

      # THINK_SANITIZE applies the flags globally rather than per-target, so
      # they reach libthink and all 62 plugins. An earlier round of
      # measurements was worthless because they reached only the harness.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHINK_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # Same reason as the linux job, and worth more here: editorcheck
        # deliberately destroys the editor at the end, so the teardown order --
        # stop the tick, close the instances, then unload the modules -- is
        # exercised under ASan and nowhere else.
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  # The WebAssembly build, held against the native one. wasm/compare.mjs
  # renders every seeded piece with scripts/genwav and with wasm/genwav.mjs:
  # the tapes, the summaries and the exit statuses must be identical, and the
  # audio may differ by one step in a sample -- libm is glibc's on one side
  # and musl's on the other, and they disagree in the last bit now and then.
  #
  # What this catches is a piece that depends on which C++ library built it:
  # a heap that breaks ties its own way, a distribution each library
  # implements differently. Such a piece composes differently under libc++,
  # which is macOS as well as wasm, and this is the one job that has both
  # libraries in front of it at once.
  #
  # This was one job and is now five: a build, and four sets of gates that
  # run at once on what it made. It was the slowest thing in this workflow
  # by a factor of two, and compiling was a fifth of it -- the rest was
  # fifteen independent test scripts run back to back on a four-core runner
  # that spent most of the time idle. The gates need three trees between
  # them and none of them writes one, so building once and handing the
  # trees on is the whole of it.
  wasm-build:
    name: wasm (emscripten) build
    runs-on: ubuntu-latest

    env:
      # Pinned: the comparison is only as repeatable as the compiler on the
      # wasm side.
      EMSDK_VERSION: 6.0.9

    steps:
      - uses: actions/checkout@v4

      # The whole top-level configure runs for the native half, and it wants
      # gtkmm, even though only the harness and the plugins are built. gtkmm
      # brings cairo's headers too, which the wasm build compiles the drawing
      # composers against.
      #
      # No pulseaudio here: the live-context tests are in the jam job, and
      # this one opens nothing.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build bison flex pkg-config \
            libgtkmm-4.0-dev libsigc++-3.0-dev \
            libasound2-dev libjack-jackd2-dev

      # The module runs the same on 20, 22 and 24; pinned so that a change of
      # runner image is not what moves the result.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # genwav is the tape every piece gate is compared against; dspedit is
      # the edit every node-editor gate is compared against. Both are what
      # the browser build has to agree with.
      - name: Native build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build --target genwav dspedit plugins

      # Most of a gigabyte, so cached on the version.
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: wasm build
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S wasm -B build-wasm -G Ninja
          cmake --build build-wasm

      # Both the room page's bundle and the composers' cairo come from npm,
      # so this comes before the browser build -- which does not merely want
      # node_modules but refuses to configure without it (wasm/web/
      # CMakeLists.txt takes cairo-canvas2d out of there by path).
      - name: npm ci
        working-directory: wasm/web
        run: npm ci

      # The browser build: every plugin and every composer linked in rather
      # than loaded, with the composer scheduler, for an AudioWorklet --
      # and the room page, bundled.
      - name: Browser build
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S wasm/web -B build-web -G Ninja
          cmake --build build-web

      # And the packaged site, which is the thing a person actually loads.
      # `dist' is an install of the tree above, and an install rule is a
      # second, hand-kept list of what the site is made of -- dsp/samples
      # fell through the gap between that list and dsp/index.json, and the
      # page answered by playing its synthesized instruments and none of
      # its sampled ones. distcheck.mjs holds the packaged tree against
      # what its own indexes and pages ask for.
      #
      # Here rather than in a gate job below: `--install' needs the build
      # tree's CMake state, and the artifact carries the site's files and
      # not that.
      - name: The packaged site has what it promises
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build build-web --target dist
          node wasm/web/distcheck.mjs

      # What the gates need and nothing else. The three build trees together
      # are more than a gigabyte, almost all of it object files and CMake's
      # own state; the binaries, the modules, the loadable plugins and the
      # site come to about thirty megabytes packed. The .so files are named
      # one directory down because `plugins/' itself is mostly the objects
      # they were linked from.
      #
      # libthink.so.7 goes with the two binaries: they are linked against it
      # and find it by a RUNPATH holding this build tree's absolute path.
      # That path is the same on every runner in this workflow, so it
      # resolves in the gate jobs -- but only if the library is there, and
      # without it genwav and dspedit exit 127 before they do anything. It
      # is a symlink to libthink.so.7.0, and upload-artifact follows it, so
      # what arrives is a real file under the name the loader asks for.
      - name: The built trees, for the gates
        uses: actions/upload-artifact@v4
        with:
          name: wasm-trees
          retention-days: 1
          path: |
            build/scripts/genwav
            build/scripts/dspedit
            build/libthink/libthink.so.7
            build/plugins/*/*.so
            build-wasm/thinksynth.mjs
            build-wasm/thinksynth.wasm
            build-wasm/plugins/*/*.so
            build-web/*.js
            build-web/*.map
            build-web/*.html
            build-web/*.css
            build-web/*.json
            build-web/*.wasm
            build-web/dsp
            build-web/gen
            build-web/patches
            build-web/cairo2d/cairo2dtest.js
            build-web/cairo2d/cairo2dtest.wasm

  # Native genwav against wasm genwav, which is what this job set is named
  # for. It is the one gate that needs the native plugins.
  wasm-compare:
    name: wasm (emscripten) against native
    runs-on: ubuntu-latest
    needs: wasm-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./.github/actions/wasm-trees
        with:
          native: 'true'

      - name: Compare
        run: node wasm/compare.mjs --lsb 1 -k compare

      # The piece that goes wrong on purpose, through both hosts. The shipped
      # pieces under gen/ all render cleanly, so nothing above exercises the
      # non-finite count or the exit 4 that goes with it -- and compare.mjs
      # holds the summary lines and the exit statuses identical, which is
      # exactly what a regression in tw_nonfinite or in genwav.mjs's status
      # handling would break.
      - name: The guard's piece, native against wasm
        run: THINK_DSP_PATH=scripts/guard node wasm/compare.mjs -s 4 scripts/guard/nonfinite.gen

      # The renders, so a difference can be listened to rather than only
      # read about.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm-compare
          path: compare/

  # The gates that drive the browser module from Node: every piece it
  # composes, every picture it draws, and the editor model it builds.
  wasm-pieces:
    name: wasm (emscripten) pieces and draws
    runs-on: ubuntu-latest
    needs: wasm-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./.github/actions/wasm-trees
        with:
          native: 'true'

      # cairo2d's replayer and drawcheck.mjs's `cairo-canvas2d' are both
      # npm packages now, not files in this tree.
      - name: npm ci
        working-directory: wasm/web
        run: npm ci

      # The cairo stand-in, on its own terms: what each call records, and
      # whether the opcodes written out in C and in JavaScript still agree.
      # It comes from npm now, so this is the pinned copy being asked, not
      # upstream's own CI being taken on trust. The module under test is
      # built by wasm-build (wasm/web/CMakeLists.txt) and arrives with the
      # trees; the replayer it is held against is in node_modules, which is
      # why this job runs npm ci above.
      - name: cairo2d
        run: |
          node build-web/cairo2d/cairo2dtest.js
          node wasm/web/node_modules/cairo-canvas2d/test/replaytest.mjs \
              build-web/cairo2d/cairo2dtest.js

      # Every shipped patch, loaded and played through the module.
      - name: Browser build, played from Node
        run: node wasm/web/check.mjs

      # The tape gate, without a browser: every seeded piece composed by this
      # module at four steps, against the tape genwav.mjs delivers out of
      # the Node module. The wasm-against-wasm gate and the step-invariance
      # gate in one. Then every shipped piece played the way the page plays
      # it, held to a peak -- a tape says what was composed and not whether
      # any of it was audible.
      #
      # It shards itself across the cores by default; every line names the
      # shard that wrote it.
      - name: Every seeded piece, against genwav; and every piece audible
        run: node wasm/web/piececheck.mjs

      # Every picture in every shipped piece, and the composer canvas
      # around them, drawn through the module and replayed: the draws are
      # in the browser build now, and what they produce is a list of ops
      # rather than pixels. Each list has to be walkable by the arity
      # table alone and known to replay.js op for op, and every composer
      # that says it draws has to have drawn something somewhere in the
      # corpus.
      - name: Every picture in every piece, and the canvas around them
        run: node wasm/web/drawcheck.mjs

      # The node editor's model, through the module: every shipped .dsp
      # built into a graph, the palette of plugins this module was compiled
      # with, and an edit of each patch held against the one
      # scripts/dspedit makes natively -- byte for byte, because a .dsp
      # somebody changes in a browser is a .dsp somebody else opens in the
      # editor.
      - name: The node editor's model, against the desktop's
        run: node wasm/web/nodecheck.mjs build-web build

  # The page and the worklet, in the two engines the page has to work in.
  wasm-browsers:
    name: wasm (emscripten) in browsers
    runs-on: ubuntu-latest
    needs: wasm-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./.github/actions/wasm-trees

      - name: npm ci
        working-directory: wasm/web
        run: npm ci

      # browsertest.mjs plays a phrase through the worklet in Chromium and
      # in Firefox and holds each against the module run directly, to the
      # bit, then runs the same piece comparison through the worklet at a
      # window of 256 and of 128. That is the plumbing between page,
      # worklet and module -- the messages, the stamps, the quanta -- in
      # the two engines the page has to work in. The two browsers run at
      # once and their output interleaves; every line names its browser.
      - name: Browser build, in browsers
        working-directory: wasm/web
        run: |
          npx playwright install --with-deps chromium firefox
          node browsertest.mjs ../../build-web ../../build-wasm

      # The solo page itself, which nothing above opens: the octave, the
      # sliders a piece's knobs are drawn as, and a computer key held and
      # let go. Both pages share keyboard.js and knobs.js, so this is
      # where a change to either shows up first. Then the composer view,
      # which has a whole second engine behind it: the picture arrives
      # from the mirror worker and is replayed, a stage is enlarged, and
      # a drag on it leaves as a command and comes back as a board that
      # has changed.
      - name: The page's keys, knobs and composer view
        working-directory: wasm/web
        run: node pagetest.mjs ../../build-web

  # Two peers agreeing on one piece: the mirror, the protocol, the relay,
  # and two real browsers in one room.
  wasm-jam:
    name: wasm (emscripten) two peers
    runs-on: ubuntu-latest
    needs: wasm-build

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pulseaudio

      # A sound card, of sorts, for jamtest below. It opens a live
      # AudioContext in both browsers, because two peers agreeing on a
      # clock is the thing under test and an offline context has no clock
      # -- and a runner has no audio device at all. Chromium falls back to
      # a null sink by itself; Firefox's AudioContext.resume() never
      # resolves without a backend, so Start never returns and the page
      # waits for ever with nothing to say about why. One null sink is
      # enough: nothing here listens to anything.
      - name: An audio sink for the live-context tests
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=jamtest
          pactl set-default-sink jamtest
          pactl info

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: ./.github/actions/wasm-trees
        with:
          native: 'true'

      - name: npm ci
        working-directory: wasm/web
        run: npm ci

      # The mirror: the module twice in one process, one rendering and one
      # with a synth that never renders, both fed the same messages through
      # the same handler, the second stepped to the frame the first's tape
      # batch reached. One tape, for every seeded piece -- and the mirror
      # dropped nothing and made no sound. Then every piece with a picture
      # that is a control, clicked: by script and through the canvas, each
      # time one tape between the two and not the untouched one.
      - name: A mirror composes what the worklet composes
        run: node wasm/web/mirrortest.mjs

      # The room's first gate, without a browser: two peers in one process at
      # different windows and rates, on a network of made-up delay and
      # loss, composing every seeded piece from stamped commands -- one
      # tape between them, and genwav's tape under the same commands.
      - name: Two peers, one tape
        run: node wasm/web/protocoltest.mjs

      # The relay, driven from Node by the clients the page will be:
      # presence, seats, the clock, signalling, the relayed fallback, and
      # the shared document reaching two providers.
      - name: The relay
        working-directory: wasm/web
        run: node relaytest.mjs

      # The room's second gate: a Chromium page and a Firefox page in one
      # room on a relay, each with a live AudioContext, one pressing Play, a
      # knob moved from each side, and one tape between them -- genwav's,
      # under the same commands. Live, because two peers agreeing on a clock
      # is the thing under test.
      #
      # Then the composer view's: a second room on a piece whose picture is
      # a control, where one page plays and the other paints a line across
      # gen::life's board with a pointer. One tape between the two, and not
      # the tape of the run nobody painted on. And then the .dsp canvas: one
      # page types a number into a node, and the file in both documents is
      # the one native NodeEdit writes -- which is why the build job builds
      # dspedit.
      - name: Two browsers, one room
        working-directory: wasm/web
        run: |
          npx playwright install --with-deps chromium firefox
          node jamtest.mjs ../../build-web ../../build-wasm ../../build

  macos:
    name: macos (clang, arm64)
    # Sequoia rather than Sonoma, and the version is the whole point of the
    # line. Homebrew bottles per macOS release and drops the oldest as it
    # goes: as of 2026-09-19 glib, glibmm, gtk4, gtkmm4 and pangomm have
    # arm64_sequoia and arm64_tahoe bottles and no arm64_sonoma one. A
    # macos-14 runner therefore *compiles* the whole GTK stack, which turned
    # a five-minute install step into three quarters of an hour of building
    # dependencies before the first line of ours.
    #
    # Nothing announces this; the job just gets slower. When it does again,
    # check which tags the formulae still carry --
    #
    #     curl -s https://formulae.brew.sh/api/formula/gtk4.json |
    #         python3 -c 'import json,sys;
    #         print(sorted(json.load(sys.stdin)["bottle"]["stable"]["files"]))'
    #
    # -- and move this label to one they cover.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          # No jack: RtAudio and RtMidi are built with CoreAudio/CoreMIDI
          # only on macOS, and having Homebrew JACK present is what produced
          # `ld: library jack not found' -- RtAudio detected it and exported a
          # bare -ljack with no -L to go with it.
          #
          # adwaita-icon-theme and librsvg are named explicitly rather than
          # left to come in behind gtkmm. The first CI run to reach -G said
          # "svg absent", which means no librsvg: without it the bundled
          # Adwaita is a directory of SVGs nothing can read.
          brew install cmake ninja pkg-config bison flex gtkmm4 \
                       adwaita-icon-theme librsvg

      # Apple ships bison 2.3 and flex 2.5.35 in /usr/bin. The grammar needs
      # bison 3 (--defines=), and Homebrew's are keg-only, so they have to be
      # put on PATH explicitly. This catches everyone exactly once.
      - name: Put Homebrew bison and flex first
        run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          bison --version | head -1
          flex --version
          # The two that skewed apart and took the job with them. Printed
          # here so that the next time Homebrew moves one of them without
          # the other, the log says which rather than leaving Configure to
          # report it as a missing gtkmm.
          brew list --versions glib glibmm gtk4 gtkmm4
          pkg-config --modversion glib-2.0 glibmm-2.68 gtkmm-4.0

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Smoke test
        run: ./build/src/thinksynth.app/Contents/MacOS/thinksynth -h

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/package

      # Against the installed .app, not the build tree. The first run of this
      # tested the build tree and duly reported "none (system GTK)", which is
      # true and useless -- nothing is bundled until it is installed.
      #
      # This cannot show independence from Homebrew's GTK, because the runner
      # has it and there is no machine here that does not. What it does show
      # is that the .app carries the data and finds it after being moved,
      # which is the half that is ours.
      - name: GTK runtime data
        run: |
          set -e
          cmake --install build --prefix "$PWD/stage"
          mv stage /tmp/relocated
          app=/tmp/relocated/thinksynth.app/Contents/MacOS/thinksynth
          "$app" -G | tee /tmp/gtk.txt
          if grep -q '^bundled GTK data: none' /tmp/gtk.txt; then
            echo "the .app did not find the data installed into it"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thinksynth-macos-arm64
          path: |
            build/package/*.tar.gz
            build/package/*.zip
            build/package/*.dmg
          if-no-files-found: error

  windows:
    name: windows (mingw-w64, ucrt64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # bison and flex come from the msys repo; everything else is the
          # ucrt64 toolchain.
          install: >-
            bison
            flex
          #
          # adwaita-icon-theme and librsvg named explicitly, for the reason
          # given in the macOS job: without librsvg there is no SVG loader,
          # and a bundled Adwaita is SVG.
          #
          # gtkmm-4.0, not gtkmm4. The short name exists but is a virtual
          # package, so pacman offers the providers and waits for a choice --
          # which in CI is "Enter a selection (default=all): error: target not
          # found".
          #
          # Every comment here is outside the block below, and has to be. That
          # `>-' makes what follows a folded scalar: it has no comment syntax,
          # so a `#' line inside it is not a comment, it is more package names.
          # pacboy duly asked for mingw-w64-ucrt-x86_64-The,
          # mingw-w64-ucrt-x86_64-short, mingw-w64-ucrt-x86_64-name, and so on
          # through the whole sentence.
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            gtkmm-4.0:p
            adwaita-icon-theme:p
            librsvg:p

      # glib 2.90.0 (in ucrt64 since 2026-09-09) and gtk4 4.24.0 (2026-09-11)
      # moved GEmblem, GDBusActionGroup and GdkCursor over to
      # G_DECLARE_FINAL_TYPE. That macro expands to
      #
      #     typedef struct { GObjectClass parent_class; } GEmblemClass;
      #
      # -- an *unnamed* struct -- while giomm and gdkmm still hand-write
      # `using GEmblemClass = struct _GEmblemClass;'. Two system headers, two
      # different types by the same name, and every translation unit that
      # includes <gtkmm.h> dies on three `conflicting declaration' errors.
      # Nothing we compile reaches it, and there is nothing to upgrade into:
      # ucrt64's newest glibmm (2.86.0) and gtkmm-4.0 (4.20.0) both predate
      # the change.
      #
      # So hold the last glib2 and gtk4 that agree with them. pacman -U after
      # the install above, because pacboy would otherwise pull the new ones
      # straight back in. Both downgrades are safe to mix with what stays
      # current: gtkmm 4.20.0 and glibmm 2.86.0-4 were built long before
      # either pinned version, and librsvg 2.63.0 -- the one package rebuilt
      # the same hour glib 2.90 landed -- imports nothing that 2.88.3 does
      # not export.
      #
      # Drop this step once ucrt64 ships a glibmm/gtkmm built against glib
      # 2.90; the build will simply stop needing it.
      - name: Hold glib2 and gtk4 where gtkmm still compiles
        run: |
          set -e
          pacman -U --noconfirm \
            https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-glib2-2.88.3-1-any.pkg.tar.zst \
            https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-gtk4-4.22.4-1-any.pkg.tar.zst

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      # Redirected, and the output checked rather than just the exit status.
      # thinksynth.exe is a GUI-subsystem program now -- so that launching it
      # does not open a terminal -- and a GUI-subsystem program prints into
      # nothing unless it attaches to a console or is redirected. `-h' exiting
      # 0 while printing nowhere would look exactly like success.
      #
      # Redirection is the case that works either way: the shell hands over a
      # real handle, so gthAttachConsole leaves it alone and stdio goes to the
      # file whether or not a console was there to attach to.
      - name: Smoke test
        run: |
          ./build/src/thinksynth.exe -h > smoke.txt 2>&1
          cat smoke.txt
          grep -q "Usage:" smoke.txt


      # Exit 127 from a .exe that plainly exists means the loader could not
      # resolve one of its imports: MSYS2 turns STATUS_DLL_NOT_FOUND into
      # ENOENT, so bash reports "No such file or directory" for the .exe
      # itself and returns 127. `ldd' names the DLL, which is the one thing
      # the failure does not say.
      - name: What could not be loaded
        if: failure()
        run: |
          ls -l build/src build/libthink build/scripts
          ldd build/src/thinksynth.exe || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The installed tree, not the build tree -- see the macOS job.
      - name: GTK runtime data
        run: |
          set -e
          # pwd -W, not $PWD: CMake here is a native Windows build and does
          # not know what /d/a/... means.
          cmake --install build --prefix "$(pwd -W)/stage"
          mv stage /tmp/relocated
          /tmp/relocated/thinksynth.exe -G | tee /tmp/gtk.txt
          if grep -q '^bundled GTK data: none' /tmp/gtk.txt; then
            echo "the package did not find the data installed into it"
            exit 1
          fi

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build/package

      - uses: actions/upload-artifact@v4
        with:
          name: thinksynth-windows-x86_64
          path: |
            build/package/*.tar.gz
            build/package/*.zip
            build/package/*.dmg
          if-no-files-found: error
